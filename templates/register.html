{% extends 'base.html' %}

{% block content %}
<section class="form-section auth-bg2">
    <div class="container">
        <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
            <div class="col-lg-6">
                <div class="form-card auth-card">
                    <h3 class="form-title text-center mb-4">Create Your Account</h3>

                    <form method="POST">
                        <div class="form-group floating mb-4">
                            <input type="text" name="name" class="form-control" required>
                            <label>Full Name</label>
                        </div>

                        <div class="form-group floating mb-4">
                            <input type="email" name="email" class="form-control" required>
                            <label>Email Address</label>
                        </div>

                        <div class="form-group floating mb-4">
                            <input type="text" name="phone" class="form-control" required>
                            <label>Phone Number</label>
                        </div>

                        <div class="form-group floating mb-4 position-relative">
                            <input type="password" id="reg_password" name="password" class="form-control" required>
                            <label>Password</label>
                            <span onclick="toggleRegPassword()" class="toggle-eye">👁</span>
                            <small style="color:red; display:none;" id="errorMsg">Passwords do not match</small>
                        </div>
                        <div class="form-group floating mb-4 position-relative">
    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
    <label>Confirm Password</label>
    <span onclick="toggleConfirmPassword()" class="toggle-eye">👁</span>
</div>

                        <button type="submit" class="btn-submit">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
function toggleRegPassword() {
    var password = document.getElementById("reg_password");
    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
function toggleRegPassword() {
    var password = document.getElementById("reg_password");
    password.type = password.type === "password" ? "text" : "password";
}

function toggleConfirmPassword() {
    var password = document.getElementById("confirm_password");
    password.type = password.type === "password" ? "text" : "password";
}

// Check password match before submit
document.querySelector("form").addEventListener("submit", function(e) {
    var pass = document.getElementById("reg_password").value;
    var confirm = document.getElementById("confirm_password").value;

    if (pass !== confirm) {
        alert("Passwords do not match!");
        e.preventDefault();
    }
});
</script>
{% endblock %}
