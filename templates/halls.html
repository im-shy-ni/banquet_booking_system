{% extends 'base.html' %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="text-center mb-4">
            <h2 class="section-title">Available Banquet Halls</h2>
            <p class="section-subtitle">Choose the ideal venue for your special occasion.</p>
        </div>

        <form method="GET" class="mb-5">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <input type="text" name="search" class="form-control" placeholder="Search halls by name...">
                </div>
            </div>
        </form>

        <div class="row g-4">
            {% for hall in halls %}
            <div class="col-md-6 col-lg-4">
                <div class="modern-card">
                    <img src="{{ url_for('static', filename='images/' + (hall.image if hall.image else 'default.jpg')) }}" alt="Hall Image">
                    <div class="card-body-modern">
                        <h5 class="card-title-modern">{{ hall.hall_name }}</h5>
                        <p class="card-text-muted"><strong>Location:</strong> {{ hall.location }}</p>
                        <p class="card-text-muted"><strong>Capacity:</strong> {{ hall.capacity }} Guests</p>
                        <div class="price-tag">₹{{ hall.price }}</div>
                        <a href="{{ url_for('hall_details', hall_id=hall.id) }}" class="btn-view">View Details</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
