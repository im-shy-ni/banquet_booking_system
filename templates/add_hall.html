{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow p-4">
                <h3 class="mb-4">Add New Hall</h3>
                <form method="POST" enctype="multipart/form-data">
                    <input type="text" name="hall_name" class="form-control mb-3" placeholder="Hall Name" required>
                    <input type="text" name="location" class="form-control mb-3" placeholder="Location" required>
                    <input type="number" name="capacity" class="form-control mb-3" placeholder="Capacity" required>
                    <input type="number" step="0.01" name="price" class="form-control mb-3" placeholder="Price" required>
                    <input type="file" name="image" class="form-control mb-3">
                    <textarea name="description" class="form-control mb-3" rows="5" placeholder="Description" required></textarea>

                    <select name="status" class="form-control mb-3" required>
                        <option value="available">Available</option>
                        <option value="unavailable">Unavailable</option>
                    </select>

                    <button type="submit" class="btn btn-success w-100">Add Hall</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
